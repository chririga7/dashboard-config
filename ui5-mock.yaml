specVersion: "3.0"
metadata:
  name: zdocconfigv1
type: application
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.fe.templates
    - name: sap.ui.fl
server:
  customMiddleware:
    - name: sap-fe-mockserver
      mountPath: /
      beforeMiddleware: csp
      configuration:
        services:
          - urlPath: /sap/opu/odata4/sap/zsd_doc_config/srvd_a2x/sap/zsd_doc_config/0001
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService
            generateMockData: false
        annotations:
          - localPath: ./webapp/annotations/annotation.xml
