specVersion: "3.0"
metadata:
  name: zdocconfigv1
type: application
builder:
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://27cc85e1-70f0-439a-b676-1b6fcc0cd5c0.abap.eu10.hana.ondemand.com
          destination: ABAP_Employee_RAP
        app:
          name: ZDOC_CONFIG
          package: ZEDOC_MONITOR
          transport: ""
        credentials:
          username: env:SAP_USERNAME
          password: env:SAP_PASSWORD
